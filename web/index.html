<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>SmartUp lecture assistant</title>
<link rel="preload" href="/widget/fonts/heebo-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/widget/fonts/rubik-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/widget/widget.css" data-smartup-widget-css="1">
<style>
  /* the page shares the widget's palette: cool paper, navy ink, and one colour per source */
  :root {
    --paper: #f3f5f9; --sheet: #ffffff; --ink: #151a30; --muted: #5c6378; --line: #dce1eb; --line-strong: #c7cedc;
    --primary: #2b4acb; --hover: #eef1f7;
    --tier-v2: #2b4acb; --tier-tedx: #e62b1e; --tier-v1: #6f778b; --tier-outsource: #0f8b7f;
    --ok: #16935a; --warn: #b7791f; --bad: #c4302b;
    --font: "Heebo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Hebrew", Arial, sans-serif;
    --font-display: "Rubik", "Heebo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0e1220; --sheet: #141a2b; --ink: #e8ebf4; --muted: #9aa1b8; --line: #242b40; --line-strong: #353d58;
      --primary: #8fa3ff; --hover: #1b2236;
      --tier-v2: #8fa3ff; --tier-tedx: #ff6b5e; --tier-v1: #a2aabf; --tier-outsource: #3cc4b3;
      --ok: #3fcf8e; --warn: #e7b04d; --bad: #ff7b74;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--font); color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .app { display: grid; grid-template-columns: 312px minmax(0, 1fr); height: 100vh; height: 100dvh; }

  /* ---- sidebar: the lecture library, one tab per source, in the order they are searched -------------- */
  .sidebar {
    background: var(--sheet); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .brand { display: flex; align-items: center; gap: 12px; padding: 18px 18px 14px; }
  .mark {
    width: 38px; height: 38px; border-radius: 10px; flex: none; display: grid; place-items: center;
    background: var(--tier-v2); color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 15px;
  }
  @media (prefers-color-scheme: dark) { .mark { background: #3a52d4; } }
  .brand-name { font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: -.01em; line-height: 1.15; }
  .brand-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .close-drawer { display: none; margin-left: auto; }

  .filter {
    display: flex; align-items: center; gap: 8px; margin: 0 14px 10px; padding: 8px 11px; border-radius: 10px;
    background: var(--paper); border: 1px solid var(--line); color: var(--muted); transition: border-color .15s;
  }
  .filter:focus-within { border-color: var(--primary); }
  .filter input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; color: var(--ink); }
  .filter input::placeholder { color: var(--muted); }
  .filter input::-webkit-search-cancel-button { cursor: pointer; }
  .filter svg { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; }

  .lectures { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 12px; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  .t-v2 { --c: var(--tier-v2); } .t-tedx { --c: var(--tier-tedx); } .t-v1 { --c: var(--tier-v1); } .t-outsource { --c: var(--tier-outsource); }

  /* a source: its number in the search order, name, what it is for; open, its lectures hang off a rail in its colour */
  .group { margin-bottom: 2px; }
  .group > summary {
    list-style: none; cursor: pointer; user-select: none; border-radius: 10px;
    display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; column-gap: 8px; align-items: baseline;
    padding: 9px 10px 9px 8px;
  }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary:hover { background: var(--hover); }
  .g-num {
    grid-row: span 2; align-self: start; margin-top: 1px;
    width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
    font-family: var(--font-display); font-size: 12px; font-weight: 700; color: #fff; background: var(--c);
  }
  @media (prefers-color-scheme: dark) { .g-num { color: #0e1220; } }
  .g-name { font-family: var(--font-display); font-size: 14.5px; font-weight: 600; letter-spacing: -.005em; }
  .g-count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .g-role { grid-column: 2 / 4; font-size: 12.5px; color: var(--muted); line-height: 1.35; margin-top: 1px; }
  .g-list { margin: 2px 0 8px 18px; padding-left: 12px; border-left: 2px solid var(--c); }

  .lect {
    display: grid; grid-template-columns: 30px minmax(0, 1fr); column-gap: 8px; align-items: baseline; width: 100%; text-align: left;
    background: none; border: 0; color: inherit; padding: 6px 8px; border-radius: 8px; cursor: pointer; transition: background .12s;
  }
  .lect:hover { background: var(--hover); }
  .lect .num {
    font-family: var(--font-display); font-size: 12.5px; font-weight: 600; color: var(--c);
    font-variant-numeric: tabular-nums; padding-top: 1px; white-space: nowrap;
  }
  .lect .main { display: block; min-width: 0; font-size: 13.5px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lib-state { font-size: 13.5px; color: var(--muted); padding: 10px; line-height: 1.5; }
  .lib-state code { font-size: 12.5px; }

  .side-foot { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 12px 18px 14px; border-top: 1px solid var(--line); font-size: 12.5px; }
  .side-foot a { color: var(--muted); text-decoration: none; }
  .side-foot a:hover { color: var(--ink); text-decoration: underline; }

  /* ---- main column ---------------------------------------------------------------------------------- */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 20px; }
  .tt-main { font-family: var(--font-display); font-size: 16px; font-weight: 600; display: none; }
  .spacer { flex: 1; }
  .status { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); white-space: nowrap; max-width: 50vw; overflow: hidden; text-overflow: ellipsis; }
  .status i { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--line-strong); }
  .status.ok i { background: var(--ok); }
  .status.degraded i { background: var(--warn); }
  .status.down i { background: var(--bad); }
  .btn {
    display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; padding: 7px 13px;
    border-radius: 10px; border: 1px solid var(--line-strong); background: var(--sheet); color: var(--ink); cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .btn:hover { border-color: var(--ink); }
  .btn svg, .icon-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.2; }
  .icon-btn {
    display: none; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px;
    border: 1px solid var(--line-strong); background: var(--sheet); color: var(--ink); cursor: pointer;
  }
  .chat { flex: 1; min-height: 0; }
  .chat .su-widget { height: 100%; }
  .scrim { position: fixed; inset: 0; background: rgba(14, 18, 32, .45); z-index: 15; }
  @media (min-width: 921px) { .scrim { display: none; } }  /* a drawer left open on a narrow window must not cover the page */

  @media (max-width: 920px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; width: min(340px, 88vw); z-index: 20; border-right: 0;
      transform: translateX(-102%); visibility: hidden; transition: transform .22s ease, visibility 0s linear .22s;
    }
    .sidebar.open { transform: none; visibility: visible; transition: transform .22s ease; box-shadow: 0 0 60px rgba(14, 18, 32, .3); }
    .icon-btn, .close-drawer { display: inline-flex; }
    .tt-main { display: block; }
    .topbar { padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--sheet); }
    .btn { padding: 8px 10px; }
    .btn span { display: none; }
  }
  @media (max-width: 520px) { .status span { display: none; } }
  @media (prefers-reduced-motion: reduce) { .sidebar { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Lecture library">
    <div class="brand">
      <div class="mark" aria-hidden="true">SU</div>
      <div>
        <div class="brand-name">SmartUp Academy</div>
        <div class="brand-sub">Yonatan Stern’s course, searchable</div>
      </div>
      <button class="icon-btn close-drawer" id="close-drawer" type="button" aria-label="Close the lecture list">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
      </button>
    </div>

    <label class="filter">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5" stroke-linecap="round"/></svg>
      <input id="filter" type="search" placeholder="Find a lecture by topic or title" autocomplete="off" aria-label="Find a lecture">
    </label>
    <div class="lectures" id="lectures" aria-label="Sources, in the order they are searched">
      <div class="lib-state">Loading the lectures…</div>
    </div>

    <nav class="side-foot" aria-label="More">
      <a href="/docs">API docs</a>
      <a id="dashlink" href="/dashboard" hidden>Pipeline dashboard</a>
    </nav>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="menu" type="button" aria-label="Show the lecture list" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" stroke-linecap="round"/></svg>
      </button>
      <span class="tt-main">Ask the lectures</span>
      <div class="spacer"></div>
      <span class="status" id="health" role="status"><i></i><span>Checking…</span></span>
      <button class="btn" id="newchat" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg><span>New chat</span>
      </button>
    </header>
    <section class="chat" id="chat" aria-label="Conversation"></section>
  </div>
</div>

<!-- The same widget that embeds on the website, rendered inline as the full chat -->
<script src="/widget/widget.js" data-mode="inline" data-target="#chat" data-storage-key="fullpage" data-theme="auto"
        data-title="SmartUp Academy Assistant" data-lang="auto"></script>
<script>
(function () {
  var apiBase = location.origin;
  var SUGGESTIONS = [
    'What does Yonatan say about profitability versus growth?',
    'מה שיעורי הבית של הרצאה 5?',
    'How should I price my product according to the course?',
    'Which lectures discuss branding?',
    'מה ההבדל בין הרצאה 1 בגרסה v1 ובגרסה v2?',
    'Summarize lecture 10'
  ];
  // the four sources, in the order the assistant searches them
  var TIERS = {
    v2: { name: 'Foundations v2', role: 'The current course. Searched first.' },
    tedx: { name: 'TEDx talk', role: 'Used when v2 has no strong match.' },
    v1: { name: 'Foundations v1', role: 'The course’s first version.' },
    outsource: { name: 'Outside the course', role: 'Other talks and the Digital Innovation lectures.' }
  };
  var sidebar = document.getElementById('sidebar'), scrim = document.getElementById('scrim'), menu = document.getElementById('menu');

  function widget() { return window.SmartUpWidget; }
  function ask(text) { if (widget()) widget().send(text); closeDrawer(); }
  if (widget()) widget().setSuggestions(SUGGESTIONS);

  // ---- drawer (narrow screens) ----
  function openDrawer() { sidebar.classList.add('open'); scrim.hidden = false; menu.setAttribute('aria-expanded', 'true'); }
  function closeDrawer() { sidebar.classList.remove('open'); scrim.hidden = true; menu.setAttribute('aria-expanded', 'false'); }
  menu.addEventListener('click', openDrawer);
  scrim.addEventListener('click', closeDrawer);
  document.getElementById('close-drawer').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });
  document.getElementById('newchat').addEventListener('click', function () { if (widget()) widget().reset(); });

  // ---- status ----
  function setStatus(kind, text, title) {
    var pill = document.getElementById('health');
    pill.className = 'status ' + kind;
    pill.querySelector('span').textContent = text;
    pill.title = title || text;
  }
  fetch(apiBase + '/health').then(function (r) { return r.json(); }).then(function (h) {
    var ix = h.index || {}, ol = h.ollama || {}, rr = h.reranker || {};
    var problems = [];
    if (!ol.ok) problems.push('Ollama is not running');
    else {
      if (ol.model_present === false) problems.push(h.chat_model + ' is not downloaded');
      if (ol.embed_model_present === false) problems.push(h.embed_model + ' is not downloaded');
    }
    if (!ix.ok) problems.push('the index is not built');
    var title = 'Chat model: ' + h.chat_model + '\nEmbeddings: ' + h.embed_model +
      '\nIndex: ' + (ix.ok ? ix.lectures + ' lectures, ' + ix.passages + ' passages' : 'not available') +
      '\nReranker: ' + (rr.enabled === false ? 'off' : (rr.model || '') + (rr.loaded ? ' (loaded)' : ' (loads with the first question)'));
    if (h.status === 'ok') setStatus('ok', 'Ready', title);
    else setStatus('degraded', problems.length ? problems[0].charAt(0).toUpperCase() + problems[0].slice(1) : 'Partly working', title);
  }).catch(function () { setStatus('down', 'Can’t reach the server'); });

  // ---- lecture library ----
  var rows = [];
  function node(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  fetch(apiBase + '/lectures').then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function (groups) {
    var box = document.getElementById('lectures'); box.textContent = '';
    // the API returns the groups in search order: v2 → TEDx → v1 → outside the course
    groups.forEach(function (g, gi) {
      var tier = g.tier || g.course_version;
      var info = TIERS[tier] || { name: g.label || tier, role: '' };
      var details = node('details', 'group t-' + tier);
      if (gi === 0) details.open = true;
      var summary = node('summary');
      summary.appendChild(node('span', 'g-num', String(gi + 1)));
      summary.appendChild(node('span', 'g-name', info.name));
      var count = node('span', 'g-count', String(g.lectures.length));
      count.title = g.lectures.length + (g.lectures.length === 1 ? ' lecture' : ' lectures');
      summary.appendChild(count);
      if (info.role) summary.appendChild(node('span', 'g-role', info.role));
      details.appendChild(summary);
      var list = node('div', 'g-list');
      g.lectures.forEach(function (l) {
        var subjects = l.lecture_subjects || [];
        var generic = /^Foundations\b/i.test(l.lecture_title || '');  // "Foundations Course V2 L5 1" says less than the topics
        var b = node('button', 'lect'); b.type = 'button';
        var short = l.display ? l.display.replace(/^Lecture\s*/i, 'L').replace(/\s*Part\s*/i, '.') : (tier === 'tedx' ? 'TEDx' : '•');
        b.appendChild(node('span', 'num', short));
        b.appendChild(node('span', 'main', generic && subjects.length ? subjects[0] : l.lecture_title));
        b.title = (l.display ? l.display + ': ' : '') + l.lecture_title + (subjects.length ? '\n\n' + subjects.join('\n') : '') +
          '\n\nClick for a summary';
        b.addEventListener('click', function () {
          if (tier === 'v2' || tier === 'v1') ask('Summarize ' + (tier === 'v1' ? 'v1 ' : '') + l.display);
          else if (tier === 'tedx') ask("Summarize Yonatan's TEDx talk");
          else ask('Summarize the lecture "' + l.lecture_title + '"');
        });
        list.appendChild(b);
        rows.push({ el: b, group: details, text: [l.display, l.lecture_title].concat(subjects).join(' ').toLowerCase() });
      });
      details.appendChild(list);
      box.appendChild(details);
    });
  }).catch(function () {
    var box = document.getElementById('lectures'); box.textContent = '';
    var msg = node('div', 'lib-state', 'The lecture list isn’t available. Build the index with ');
    msg.appendChild(node('code', null, 'smartup ingest'));
    msg.appendChild(document.createTextNode(', then reload.'));
    box.appendChild(msg);
  });

  document.getElementById('filter').addEventListener('input', function (e) {
    var q = e.target.value.trim().toLowerCase();
    var shown = new Map();
    rows.forEach(function (r) {
      var hit = !q || r.text.indexOf(q) >= 0;
      r.el.hidden = !hit;
      shown.set(r.group, (shown.get(r.group) || 0) + (hit ? 1 : 0));
    });
    shown.forEach(function (n, group) {
      group.hidden = n === 0;
      if (q) group.open = n > 0;
      group.querySelector('.g-count').textContent = String(n);
    });
  });

  // the dashboard link appears only when the API shares traces with this browser (DEBUG_DASHBOARD)
  fetch('/debug/traces', { cache: 'no-store' }).then(function (r) { if (r.ok) document.getElementById('dashlink').hidden = false; }).catch(function () {});
})();
</script>
</body>
</html>
